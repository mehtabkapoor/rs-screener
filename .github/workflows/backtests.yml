name: Backtests (all strategies)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional subset, space-separated: s1 s2 s4. Blank = run all.'
        required: false
        default: ''

concurrency:
  group: backtests
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtests
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python backtest_all.py --only $ONLY
          else
            python backtest_all.py
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backtest-output
          path: |
            *.csv
            backtest_outputs/
          if-no-files-found: ignore
          retention-days: 30
