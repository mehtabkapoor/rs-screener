name: Daily RS Screener

on:
  schedule:
    # Runs at 11:15 UTC = 4:45 PM IST, Mon-Fri (after NSE close + settle time)
    - cron: '15 11 * * 1-5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RS screener
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python rs_screener.py
