name: Daily RS Screener

on:
  schedule:
    # ---- Add or edit as many scan times as you like below ----
    # Format: 'MINUTE HOUR * * DAYS' in UTC. IST = UTC + 5:30.
    # DAYS: 1-5 = Mon-Fri.
    #
    # The EOD_CRON value in rs_screener.py must exactly match ONE of these --
    # that one becomes the real end-of-day run (updates Portfolio/Holdings).
    # Every other time listed here runs as an automatic PREVIEW scan (updates
    # the RS_Screener ranking tab with live prices, never touches Portfolio).
    #
    # Quick IST -> UTC reference:
    #   9:30 AM IST  -> 04:00 UTC
    #   12:00 PM IST -> 06:30 UTC
    #   1:00 PM IST  -> 07:30 UTC
    #   3:00 PM IST  -> 09:30 UTC
    #   4:45 PM IST  -> 11:15 UTC   <-- designated EOD run (matches EOD_CRON below)
    - cron: '15 11 * * 1-5'   # 4:45 PM IST -- EOD (real Portfolio/Holdings update)
    # - cron: '00 06 * * 1-5'   # example: 11:30 AM IST -- automatic preview scan
    # - cron: '30 09 * * 1-5'   # example: 3:00 PM IST  -- automatic preview scan

  workflow_dispatch:
    inputs:
      force_eod:
        description: 'Force real EOD mode (updates Portfolio/Holdings) instead of preview'
        required: false
        type: boolean
        default: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RS screener
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FORCE_EOD: ${{ inputs.force_eod }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python rs_screener.py
