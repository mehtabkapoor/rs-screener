name: Screener - Top 10 (daily)

on:
  schedule:
    # 'MINUTE HOUR * * DAYS' in UTC. IST = UTC + 5:30. DAYS 1-5 = Mon-Fri.
    #
    # EOD_CRON in screener_top10.py must exactly match ONE of these --
    # that one is the real end-of-day run (updates Portfolio/Holdings).
    # Every other time listed here runs as a PREVIEW (RS_Screener tab only).
    #
    #   9:30 AM IST -> 04:00 UTC    12:00 PM IST -> 06:30 UTC
    #   3:00 PM IST -> 09:30 UTC     4:45 PM IST -> 11:15 UTC  <-- EOD
    - cron: '15 11 * * 1-5'   # 4:45 PM IST -- EOD
    # - cron: '00 06 * * 1-5' # 11:30 AM IST -- preview
  workflow_dispatch:
    inputs:
      force_eod:
        description: 'Force real EOD mode (updates Portfolio/Holdings) instead of preview'
        type: boolean
        default: false

concurrency:
  group: screener-top10
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Top 10 screener
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FORCE_EOD: ${{ inputs.force_eod }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python screener_top10.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screener-top10-output
          path: '*.csv'
          if-no-files-found: ignore
          retention-days: 14
