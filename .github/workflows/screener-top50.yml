name: Screener - Top 50 (Core + Total Market)

on:
  workflow_dispatch:

concurrency:
  group: screener-top50
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Top 50 screener
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python screener_top50.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screener-top50-output
          path: '*.csv'
          if-no-files-found: ignore
          retention-days: 14
